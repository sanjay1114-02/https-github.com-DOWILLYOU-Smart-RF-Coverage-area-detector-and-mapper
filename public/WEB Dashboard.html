<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <title>RF Signal Mapper & Live Coverage</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; }
        
        #map-container {
            position: relative;
            height: calc(100vh - 160px);
            width: 100vw;
        }

        #map { height: 100%; width: 100%; }

        /* Floating Recenter Location Button (GMap Style) */
        .recenter-btn {
            position: absolute;
            bottom: 25px;
            right: 15px;
            z-index: 1000;
            background: #1e1e24;
            color: #00d2ff;
            border: 2px solid #007bff;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }
        .recenter-btn:hover {
            background: #007bff;
            color: #fff;
            transform: scale(1.08);
        }

        /* Bottom Control Panel UI */
        .bottom-panel {
            height: 160px;
            width: 100vw;
            background: #1e1e24;
            border-top: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 12px 20px;
            justify-content: space-between;
        }

        .mode-tabs {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .tabs-left {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: #2a2a35;
            color: #aaa;
            border: 1px solid #444;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }

        /* Carrier Selector Dropdown styling */
        .carrier-filter-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #141419;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .carrier-select {
            background: #1e1e24;
            color: #00d2ff;
            border: 1px solid #444;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        .metrics-grid {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #141419;
            padding: 10px;
            border-radius: 8px;
        }

        .metric-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .metric-label { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
        .metric-value { font-size: 16px; font-weight: bold; color: #00d2ff; }

        .actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-start { background: #28a745; }
        .btn-start:hover { background: #218838; }
        .btn-stop { background: #dc3545; }
        .btn-stop:hover { background: #c82333; }
        .btn-sync { background: #007bff; }
        .btn-sync:hover { background: #0056b3; }

        .status-text { font-size: 12px; color: #bbb; font-style: italic; }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
        <!-- Google Maps Style Recenter Location Button -->
        <button class="recenter-btn" onclick="recenterToUserLocation()" title="Re-center map to my location">🎯</button>
    </div>

    <!-- Bottom Full-Width Dashboard -->
    <div class="bottom-panel">
        <div class="mode-tabs">
            <div class="tabs-left">
                <button id="tab-user" class="tab-btn active" onclick="switchMode('user')">🗺️ Map User Mode</button>
                <button id="tab-collector" class="tab-btn" onclick="switchMode('collector')">📡 Take readings & upload to cloud</button>
            </div>

            <!-- Provider Switcher Options -->
            <div id="carrierFilterWrapper" class="carrier-filter-container">
                <span style="font-size: 12px; color: #aaa;">📶 Select Provider:</span>
                <select id="carrierSelect" class="carrier-select" onchange="filterMapByCarrier()">
                    <option value="ALL">All Providers (Combined)</option>
                    <option value="Jio">Jio</option>
                    <option value="Airtel">Airtel</option>
                    <option value="Vodafone Vi">Vodafone Vi</option>
                    <option value="ESP32 Prototype">ESP32 Prototype</option>
                </select>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-label">Active Provider View</span>
                <span id="carrierName" class="metric-value">All Networks</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Signal Strength</span>
                <span id="signalStrength" class="metric-value">- dBm</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Nearest Strong Signal</span>
                <span id="nearestDistance" class="metric-value">Calculating...</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Filtered Cloud Points</span>
                <span id="totalPoints" class="metric-value">0</span>
            </div>
        </div>

        <div class="actions-row">
            <span id="statusMessage" class="status-text">Status: Ready</span>
            <div>
                <button id="recordingBtn" class="action-btn btn-start" style="display:none;" onclick="toggleRecording()">▶️ Start Continuous Recording</button>
                <button class="action-btn btn-sync" onclick="fetchServerData()">🔄 Sync Map</button>
            </div>
        </div>
    </div>

    <!-- Leaflet & Heatmap Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <script>
        let currentMode = 'user';
        let allReadings = [];
        let userLocationMarker = null;
        let currentUserCoords = null;

        // Continuous Recording Variables
        let isRecording = false;
        let recordingWatchId = null;

        // Initialize Map
        const map = L.map('map').setView([11.0168, 76.9558], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let heatLayer = L.heatLayer([], { radius: 25, blur: 15, maxZoom: 17 }).addTo(map);

        function normalizeRssi(rssi) {
            const min = -110, max = -50;
            return Math.max(0.1, Math.min(1.0, (rssi - min) / (max - min)));
        }

        // Calculate distance between two coordinates in meters (Haversine Formula)
        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const rad = Math.PI / 180;
            const dLat = (lat2 - lat1) * rad;
            const dLon = (lon2 - lon1) * rad;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // Recenter map back to current user position
        function recenterToUserLocation() {
            if (currentUserCoords) {
                map.flyTo([currentUserCoords.latitude, currentUserCoords.longitude], 16, { animate: true, duration: 1 });
            } else {
                alert("Acquiring GPS location... Please wait a moment.");
            }
        }

        // Find nearest strong signal point (>= -70 dBm)
        function calculateNearestStrongSignal(userLat, userLng) {
            const selectedCarrier = document.getElementById('carrierSelect').value;
            
            let filteredReadings = allReadings;
            if (selectedCarrier !== 'ALL') {
                filteredReadings = allReadings.filter(r => (r.carrier || "ESP32 Prototype") === selectedCarrier);
            }

            const strongPoints = filteredReadings.filter(r => r.rssi >= -70);
            if (strongPoints.length === 0) return 'No strong signals nearby';

            let minDistance = Infinity;
            strongPoints.forEach(pt => {
                const dist = getDistanceMeters(userLat, userLng, pt.lat, pt.lng);
                if (dist < minDistance) minDistance = dist;
            });

            return minDistance < 1000 
                ? `${Math.round(minDistance)} meters away` 
                : `${(minDistance / 1000).toFixed(1)} km away`;
        }

        // Filter and re-render heatmap layer based on selected provider
        function filterMapByCarrier() {
            const selectedCarrier = document.getElementById('carrierSelect').value;
            
            let filtered = allReadings;
            if (selectedCarrier !== 'ALL') {
                filtered = allReadings.filter(r => (r.carrier || "ESP32 Prototype") === selectedCarrier);
            }

            const heatPoints = filtered.map(r => [r.lat, r.lng, normalizeRssi(r.rssi)]);
            heatLayer.setLatLngs(heatPoints);

            document.getElementById('totalPoints').innerText = filtered.length;
            document.getElementById('carrierName').innerText = selectedCarrier === 'ALL' ? 'All Networks' : selectedCarrier;

            if (filtered.length > 0) {
                const last = filtered[filtered.length - 1];
                document.getElementById('signalStrength').innerText = `${last.rssi} dBm`;
            } else {
                document.getElementById('signalStrength').innerText = `- dBm`;
            }

            // Recalculate distance metric for current user position
            if (currentUserCoords) {
                document.getElementById('nearestDistance').innerText = calculateNearestStrongSignal(currentUserCoords.latitude, currentUserCoords.longitude);
            }
        }

        // Switch Dashboard Modes
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-user').classList.toggle('active', mode === 'user');
            document.getElementById('tab-collector').classList.toggle('active', mode === 'collector');
            
            const recordBtn = document.getElementById('recordingBtn');
            recordBtn.style.display = mode === 'collector' ? 'inline-block' : 'none';

            if (mode === 'collector') {
                document.getElementById('statusMessage').innerText = isRecording 
                    ? "Continuous Recording ACTIVE..." 
                    : "Collector Mode: Press Start to log continuous data.";
            } else {
                document.getElementById('statusMessage').innerText = "User Mode: Browsing signal coverage.";
            }
        }

        // Continuous location monitoring for current marker
        function trackUserLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(pos => {
                    currentUserCoords = pos.coords;
                    const { latitude, longitude } = pos.coords;
                    
                    if (!userLocationMarker) {
                        userLocationMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("Your Location");
                        map.setView([latitude, longitude], 15);
                    } else {
                        userLocationMarker.setLatLng([latitude, longitude]);
                    }

                    document.getElementById('nearestDistance').innerText = calculateNearestStrongSignal(latitude, longitude);
                }, err => {
                    console.warn("Geolocation warning:", err.message);
                }, { enableHighAccuracy: true });
            }
        }

        // Fetch data from Node.js server
        async function fetchServerData() {
            try {
                const res = await fetch('/api/readings');
                allReadings = await res.json();
                filterMapByCarrier();
                document.getElementById('statusMessage').innerText = "Data updated from server.";
            } catch (err) {
                document.getElementById('statusMessage').innerText = "Server offline. Showing local data.";
            }
        }

        // Start/Stop Continuous Signal Recording
        function toggleRecording() {
            const btn = document.getElementById('recordingBtn');

            if (!isRecording) {
                // START RECORDING
                if (!("geolocation" in navigator)) {
                    alert("Geolocation is not supported by your browser.");
                    return;
                }

                isRecording = true;
                btn.innerText = "⏹️ Stop Recording";
                btn.className = "action-btn btn-stop";
                document.getElementById('statusMessage').innerText = "🔴 Recording active... Moving around logs live readings!";

                // Start active continuous tracking
                recordingWatchId = navigator.geolocation.watchPosition(
                    async (pos) => {
                        const selectedCarrier = document.getElementById('carrierSelect').value;
                        
                        // Use currently selected carrier or default to ESP32 Prototype
                        const targetCarrier = (selectedCarrier !== 'ALL') ? selectedCarrier : "ESP32 Prototype";

                        const payload = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            rssi: Math.floor(Math.random() * 41) - 100, // Simulated RSSI value (-100 to -60 dBm)
                            carrier: targetCarrier,
                            timestamp: new Date().toISOString()
                        };

                        try {
                            const res = await fetch('/api/readings', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            if (res.ok) {
                                document.getElementById('statusMessage').innerText = `🔴 Recording... Saved reading at (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`;
                                fetchServerData();
                            }
                        } catch (err) {
                            console.error("Recording payload failed:", err);
                        }
                    },
                    (err) => {
                        console.error("GPS Recording Error:", err);
                        document.getElementById('statusMessage').innerText = "GPS error while recording.";
                    },
                    { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
                );

            } else {
                // STOP RECORDING
                isRecording = false;
                if (recordingWatchId !== null) {
                    navigator.geolocation.clearWatch(recordingWatchId);
                    recordingWatchId = null;
                }
                btn.innerText = "▶️ Start Continuous Recording";
                btn.className = "action-btn btn-start";
                document.getElementById('statusMessage').innerText = "⏹️ Recording stopped. All points saved.";
            }
        }

        // Start initialization
        fetchServerData();
        trackUserLocation();
    </script>
</body>
</html>
